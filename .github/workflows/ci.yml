name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            admin-web/package-lock.json

      - name: Install backend
        working-directory: backend
        run: npm ci

      - name: Run backend tests
        working-directory: backend
        env:
          JWT_SECRET: ci-test-jwt-secret-at-least-32-bytes
        run: npm test

      - name: Install admin web
        working-directory: admin-web
        run: npm ci

      - name: Build admin web
        working-directory: admin-web
        run: npm run build
